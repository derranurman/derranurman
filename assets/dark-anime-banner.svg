<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Derra Kusdianurman — dark anime developer banner</title>
  <desc id="desc">Animated dark anime banner with a red moon, hooded developer, rain, particles, and code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="0.58" stop-color="#0b090d"/>
      <stop offset="1" stop-color="#17070b"/>
    </linearGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ff7184"/>
      <stop offset="0.45" stop-color="#d72e48"/>
      <stop offset="1" stop-color="#761322"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29202a"/>
      <stop offset="0.5" stop-color="#100e14"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd4d3"/>
      <stop offset="0.55" stop-color="#c98f99"/>
      <stop offset="1" stop-color="#743843"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0e18"/>
      <stop offset="1" stop-color="#0d080d"/>
    </linearGradient>
    <filter id="redGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="24"/></clipPath>
    <style>
      .rain { animation: fall 1.35s linear infinite; }
      .rain.slow { animation-duration: 1.9s; animation-delay: -.7s; opacity: .38; }
      .rain.fast { animation-duration: .95s; animation-delay: -.25s; opacity: .7; }
      .particle { animation: drift 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .p2 { animation-delay: -1.4s; animation-duration: 6s; }
      .p3 { animation-delay: -3.2s; animation-duration: 5.2s; }
      .moon { animation: breathe 4.5s ease-in-out infinite; transform-origin: 912px 168px; }
      .character { animation: characterIn 1.4s cubic-bezier(.18,.82,.25,1) both; transform-origin: 925px 275px; }
      .eye { animation: blink 5.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .screen-line { animation: code 2.4s ease-in-out infinite; }
      .screen-line:nth-child(2) { animation-delay: -.7s; }
      .screen-line:nth-child(3) { animation-delay: -1.4s; }
      .cursor { animation: cursor .82s steps(1) infinite; }
      .headline { animation: reveal .9s .25s ease-out both; }
      .subline { animation: reveal .9s .55s ease-out both; }
      .rule { animation: draw 1.1s .8s ease-out both; transform-origin: left; }
      @keyframes fall { from { transform: translateY(-120px); } to { transform: translateY(430px); } }
      @keyframes drift { 0%,100% { transform: translate(0,0) scale(.8); opacity:.25; } 50% { transform:translate(-16px,-22px) scale(1.25); opacity:.9; } }
      @keyframes breathe { 0%,100% { transform:scale(.985); opacity:.86; } 50% { transform:scale(1.025); opacity:1; } }
      @keyframes characterIn { from { opacity:0; transform:translate(46px,22px) scale(.96); } to { opacity:1; transform:none; } }
      @keyframes blink { 0%,44%,48%,100% { transform:scaleY(1); } 46% { transform:scaleY(.08); } }
      @keyframes code { 0%,100% { opacity:.3; } 50% { opacity:1; } }
      @keyframes cursor { 50% { opacity:0; } }
      @keyframes reveal { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
      @keyframes draw { from { transform:scaleX(0); } to { transform:scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <path d="M0 290 C240 245 390 320 590 278 S990 245 1200 292 V360 H0Z" fill="#08070b"/>
    <path d="M0 317 C260 277 420 342 670 306 S1030 292 1200 321" fill="none" stroke="#2a1118" stroke-width="2" opacity=".65"/>

    <circle cx="920" cy="161" r="125" fill="#ad1830" opacity=".18" filter="url(#softGlow)"/>
    <circle class="moon" cx="920" cy="161" r="108" fill="url(#moon)"/>
    <path d="M850 105c28 7 49-20 83-8 29 10 38 34 75 32M834 178c27-15 52-4 75-13 30-12 58-4 103-18M865 223c24-8 46 2 70-4 19-5 39-4 57 2" fill="none" stroke="#6d101e" stroke-width="7" opacity=".35"/>

    <g fill="#ed4960" filter="url(#redGlow)">
      <circle class="particle" cx="760" cy="92" r="2.5"/>
      <circle class="particle p2" cx="817" cy="52" r="1.8"/>
      <circle class="particle p3" cx="1064" cy="94" r="2.2"/>
      <circle class="particle p2" cx="1110" cy="190" r="1.5"/>
      <circle class="particle p3" cx="731" cy="218" r="1.7"/>
      <circle class="particle" cx="1036" cy="253" r="2.1"/>
    </g>

    <g stroke="#8d3544" stroke-width="1.3" opacity=".55">
      <g class="rain">
        <path d="M80-40l-22 66M250-80l-22 66M424-25l-22 66M600-92l-22 66M792-45l-22 66M1080-70l-22 66"/>
        <path d="M160 90l-22 66M352 40l-22 66M531 102l-22 66M704 54l-22 66M1138 72l-22 66"/>
      </g>
      <g class="rain slow">
        <path d="M34-20L8 58M310-50l-26 78M670-90l-26 78M870-30l-26 78M1170-55l-26 78"/>
        <path d="M205 130l-26 78M480 95l-26 78M740 145l-26 78M1060 115l-26 78"/>
      </g>
      <g class="rain fast">
        <path d="M115-90L98-39M390-60l-17 51M565-10l-17 51M830-80l-17 51M1010-20l-17 51"/>
        <path d="M285 170l-17 51M654 135l-17 51M1090 160l-17 51"/>
      </g>
    </g>

    <g class="character">
      <path d="M787 336c13-67 30-117 72-145 38-25 105-25 139 6 33 30 47 82 62 139z" fill="url(#hood)" stroke="#48232e" stroke-width="3"/>
      <path d="M858 196c-10-73 26-120 75-127 56-8 103 39 99 112-12-28-33-47-62-58-39-14-78 7-112 73z" fill="url(#hood)" stroke="#542630" stroke-width="3"/>
      <path d="M876 169c15-47 42-70 78-61 38 9 48 50 29 86-15 29-43 44-72 31-28-12-47-30-35-56z" fill="url(#face)"/>
      <path d="M876 169c0-47 31-76 69-67 32 7 50 32 52 58-15-17-31-28-49-32-1 28-14 51-39 72 4-28-3-49-33-31z" fill="#d6c5ca"/>
      <path d="M883 154c11-37 39-58 70-49-26 10-45 32-52 65-6-12-10-17-18-16z" fill="#f0e1e2" opacity=".75"/>
      <path d="M956 165q12 9 24-1" fill="none" stroke="#9b3448" stroke-width="3.4" stroke-linecap="round" class="eye" filter="url(#redGlow)"/>
      <path d="M948 192q14 8 25 0" fill="none" stroke="#7a3642" stroke-width="2" opacity=".65"/>
      <path d="M857 220c19-19 33-24 50-17-20 20-28 49-32 86l-54 21c1-35 11-68 36-90z" fill="#17131a"/>
      <path d="M1005 208c22 17 36 47 44 88l-73-17c-2-37-2-56 29-71z" fill="#111015"/>
      <path d="M773 279h197l-20 79H753z" fill="url(#screen)" stroke="#692231" stroke-width="3"/>
      <path d="M780 286h181l-15 60H765z" fill="#09070b"/>
      <g fill="#ef5368" opacity=".85">
        <rect class="screen-line" x="792" y="301" width="66" height="4" rx="2"/>
        <rect class="screen-line" x="792" y="315" width="103" height="4" rx="2"/>
        <rect class="screen-line" x="792" y="329" width="45" height="4" rx="2"/>
        <rect class="cursor" x="842" y="328" width="3" height="7"/>
      </g>
      <path d="M732 356h261" stroke="#8b3343" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="74" y="78" font-size="14" letter-spacing="3" fill="#d94b60">PROFILE // ONLINE</text>
      <g class="headline">
        <text x="70" y="155" font-size="52" font-weight="700" fill="#f4edf0" letter-spacing="-2">DERRA</text>
        <text x="70" y="208" font-size="52" font-weight="700" fill="#f4edf0" letter-spacing="-2">KUSDIANURMAN</text>
      </g>
      <line class="rule" x1="72" y1="231" x2="560" y2="231" stroke="#9b283b" stroke-width="2"/>
      <g class="subline">
        <text x="72" y="266" font-size="17" fill="#bd9ba3">Laravel • PHP • Web Developer</text>
        <text x="72" y="303" font-size="14" fill="#8c757d">building after dark, one commit at a time</text>
        <rect class="cursor" x="462" y="289" width="8" height="17" fill="#e44960"/>
      </g>
    </g>

    <rect x="1.5" y="1.5" width="1197" height="357" rx="23" fill="none" stroke="#3b2027" stroke-width="3"/>
    <path d="M25 1.5h220M955 358.5h220" stroke="#bd3148" stroke-width="3" opacity=".8"/>
  </g>
</svg>
